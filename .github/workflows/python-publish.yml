name: Publish Python package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          core = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          web = tomllib.loads(Path("web/pyproject.toml").read_text())["project"]
          assert core["version"] == web["version"]
          assert core["optional-dependencies"]["web"] == [f"mihomo-py-web=={web['version']}"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"v{core['version']}"
          PY
          python -m build --sdist --wheel
          MIHOMO_BUILD_ARCH=aarch64 python -m build --wheel
          python -m twine check dist/*
          python -m build --outdir web-dist web
          python -m twine check web-dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: |
            dist/
            web-dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dists
          path: dist/

      - name: Publish optional Web resources to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/web-dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish main package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
