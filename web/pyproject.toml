[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "mihomo-py-web"
version = "0.1.3"
description = "Offline zashboard resources for mihomo-py[web]"
readme = "README.md"
requires-python = ">=3.11"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mihomo_py_web"]

[tool.hatch.build.targets.sdist]
include = ["src", "frontend", "pyproject.toml", "hatch_build.py", "README.md"]
exclude = ["/frontend/node_modules"]
